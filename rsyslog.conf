module(load="imuxsock") # Local system logging
module(load="immark")   # Periodic heartbeat mark messages

# Generate a heartbeat log every 10 seconds so you immediately see traffic
$MarkMessagePeriod 10

# Forward all logs to Grafana Alloy over TCP using RFC 5424 format
*.* action(
    type="omfwd"
    target="alloy"
    port="1514"
    protocol="tcp"
    Template="RSYSLOG_SyslogProtocol23Format"
    action.resumeRetryCount="-1"
    queue.type="linkedList"
    queue.size="10000"
)