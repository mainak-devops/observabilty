module(load="imuxsock")
module(load="immark" interval="10")

template(name="AlloyRFC5424" type="string"
         string="<%PRI%>1 %TIMESTAMP:::date-rfc3339% %HOSTNAME% %APP-NAME% %PROCID% %MSGID% - %msg%\n")

*.* action(
    type="omfwd"
    target="alloy"
    port="1514"
    protocol="tcp"
    Template="AlloyRFC5424"
    action.resumeRetryCount="-1"
    queue.type="linkedList"
    queue.size="10000"
)
