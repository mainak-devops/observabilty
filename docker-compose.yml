services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver" # Allows Alloy to push scraped metrics
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - obs-net

  loki:
    image: grafana/loki:3.2.1
    container_name: loki
    command: ["-config.file=/etc/loki/local-config.yml"]
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yml:ro
    ports:
      - "3100:3100"
    networks:
      - obs-net

  alloy:
    image: grafana/alloy:v1.5.0
    container_name: alloy
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy/config.alloy"
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
    ports:
      - "12345:12345" # Alloy UI / Graph visualizer
      - "1514:1514"   # Syslog TCP receiver
      - "4317:4317"   # OpenTelemetry gRPC receiver
      - "4318:4318"   # OpenTelemetry HTTP receiver
    depends_on:
      - prometheus
      - loki
    networks:
      - obs-net

  rsyslog:
    image: rsyslog/syslog_appliance_alpine:latest
    container_name: rsyslog
    volumes:
      - ./rsyslog.conf:/etc/rsyslog.conf:ro
    depends_on:
      - alloy
    networks:
      - obs-net

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - obs-net

networks:
  obs-net:
    driver: bridge